<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设备详情 - {{ device.ip }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 漏洞严重程度样式 */
        .vuln-critical { background-color: #dc3545; color: white; }
        .vuln-high { background-color: #fd7e14; color: white; }
        .vuln-medium { background-color: #ffc107; color: black; }
        .vuln-low { background-color: #6c757d; color: white; }

        /* 风险评分样式 */
        .risk-score {
            font-size: 3rem;
            font-weight: bold;
            line-height: 1;
        }
        .risk-label {
            font-size: 0.9rem;
            color: #6c757d;
            margin-top: 5px;
        }

        /* 扫描按钮区域 */
        .scan-controls {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        /* 漏洞计数器 */
        .vuln-counter {
            font-size: 1.1rem;
            padding: 8px 15px;
            border-radius: 20px;
        }

        /* 扫描状态 */
        .scan-status-badge {
            font-size: 0.9rem;
            padding: 8px 15px;
        }

        /* 手风琴样式优化 */
        .accordion-button {
            padding: 15px 20px;
        }
        .accordion-body {
            padding: 20px;
            background-color: #f8f9fa;
        }

        /* 修复建议框 */
        .fix-box {
            border-left: 4px solid #198754;
            padding: 15px;
            margin-top: 10px;
        }

        /* 隐藏加载动画 */
        .scan-loading {
            display: none;
        }

        /* PDF按钮样式 */
        .btn-pdf {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            border: none;
            box-shadow: 0 2px 4px rgba(220, 53, 69, 0.3);
            transition: all 0.3s ease;
        }
        .btn-pdf:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.4);
        }
        .btn-pdf svg {
            margin-right: 6px;
        }

        /* 扫描完成后的操作栏 */
        .post-scan-actions {
            display: none;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container-fluid" style="padding: 30px;">
        <!-- 页面标题 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🔍 设备详情</h2>
            <a href="{{ url_for('device.index') }}" class="btn btn-secondary">← 返回设备列表</a>
        </div>

        <!-- 设备基本信息卡片 -->
        <div class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white py-3">
                <h5 class="mb-0">📱 基本信息</h5>
            </div>
            <div class="card-body p-4">
                <div class="row">
                    <div class="col-md-6">
                        <table class="table table-borderless mb-0">
                            <tr>
                                <td width="120" class="text-muted"><strong>IP地址</strong></td>
                                <td class="fs-5">{{ device.ip }}</td>
                            </tr>
                            <tr>
                                <td class="text-muted"><strong>MAC地址</strong></td>
                                <td><code class="fs-6">{{ device.mac }}</code></td>
                            </tr>
                        </table>
                    </div>
                    <div class="col-md-6">
                        <table class="table table-borderless mb-0">
                            <tr>
                                <td width="120" class="text-muted"><strong>厂商</strong></td>
                                <td>{{ device.vendor }}</td>
                            </tr>
                            <tr>
                                <td class="text-muted"><strong>设备类型</strong></td>
                                <td><span class="badge bg-info fs-6">{{ device.device_type or '未知' }}</span></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- ========== 主动漏洞扫描区域（核心功能） ========== -->
        <div class="card mb-4 shadow border-danger">
            <div class="card-header bg-danger text-white py-3 d-flex justify-content-between align-items-center">
                <h5 class="mb-0">🛡️ 主动漏洞扫描</h5>
                <div class="d-flex align-items-center gap-2">
                    <!-- PDF下载按钮（常驻头部，随时可下载历史报告） -->
                    <a href="/api/report/pdf/{{ device.mac }}"
                       class="btn btn-light btn-sm btn-pdf text-white"
                       target="_blank"
                       title="导出PDF安全报告（包含历史扫描记录）">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: text-bottom;">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                        📄 导出PDF报告
                    </a>
                    <span id="scanStatus" class="badge bg-light text-dark scan-status-badge">未扫描</span>
                </div>
            </div>
            <div class="card-body p-4">

                <!-- 扫描控制区域 -->
                <div class="scan-controls">
                    <div class="row align-items-center">
                        <div class="col-md-4">
                            <button class="btn btn-danger btn-lg w-100" onclick="startVulnScan('{{ device.ip }}', '{{ device.mac }}')" id="scanBtn">
                                <span class="spinner-border spinner-border-sm scan-loading me-2" id="scanSpinner"></span>
                                <span id="scanBtnText">🔍 开始漏洞扫描</span>
                            </button>
                        </div>
                        <div class="col-md-4 text-center">
                            <button class="btn btn-outline-secondary" onclick="loadScanHistory('{{ device.ip }}')">
                                🔄 刷新历史记录
                            </button>
                        </div>
                        <div class="col-md-4 text-muted text-end">
                            <small>检测：弱口令、未授权访问、协议漏洞</small>
                        </div>
                    </div>

                    <!-- 扫描完成后的快捷操作栏（动态显示） -->
                    <div id="postScanActions" class="post-scan-actions mt-3 pt-3 border-top">
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-success fw-bold">✓ 扫描完成</span>
                            <a id="latestPdfLink" href="/api/report/pdf/{{ device.mac }}"
                               class="btn btn-danger btn-pdf"
                               target="_blank">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: inline-block; vertical-align: text-bottom; margin-right: 6px;">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                                下载本次扫描PDF报告
                            </a>
                        </div>
                    </div>
                </div>

                <!-- 扫描进度提示 -->
                <div id="scanAlert" class="alert d-none mb-3"></div>

                <!-- 扫描结果概览 -->
                <div id="scanSummary" style="display: none;">
                    <div class="row align-items-center">
                        <!-- 风险评分 -->
                        <div class="col-md-3 text-center mb-3 mb-md-0">
                            <div class="card border-2">
                                <div class="card-body py-4">
                                    <div class="risk-score" id="riskScore">0</div>
                                    <div class="risk-label">风险评分 (0-10)</div>
                                </div>
                            </div>
                        </div>

                        <!-- 漏洞统计 -->
                        <div class="col-md-9">
                            <div class="d-flex flex-wrap gap-2 mb-3">
                                <span class="badge vuln-critical vuln-counter" id="criticalCount">严重: 0</span>
                                <span class="badge vuln-high vuln-counter" id="highCount">高危: 0</span>
                                <span class="badge vuln-medium vuln-counter" id="mediumCount">中危: 0</span>
                                <span class="badge vuln-low vuln-counter" id="lowCount">低危: 0</span>
                            </div>
                            <div class="alert alert-light border">
                                <p id="scanSummaryText" class="mb-1 text-dark"></p>
                                <small class="text-muted">
                                    扫描时间: <span id="scanTime"></span>
                                </small>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 漏洞详情列表 -->
                <div id="vulnList" class="mt-4" style="display: none;">
                    <h5 class="mb-3 border-bottom pb-2">🚨 发现的漏洞详情</h5>
                    <div class="accordion" id="vulnAccordion">
                        <!-- 动态填充 -->
                    </div>
                </div>

                <!-- 历史扫描记录 -->
                <div id="scanHistory" class="mt-4 pt-3 border-top">
                    <h5 class="mb-3 text-muted">📜 历史扫描记录</h5>
                    <div id="historyList" class="list-group">
                        <div class="text-muted p-3 bg-light rounded">点击"刷新历史记录"加载</div>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function startVulnScan(ip, mac) {
            // 使用MAC地址作为设备ID更稳定
            const deviceId = mac || ip;

            document.getElementById('scanBtn').disabled = true;
            document.getElementById('scanSpinner').classList.remove('scan-loading');
            document.getElementById('scanSpinner').style.display = 'inline-block';
            document.getElementById('scanBtnText').textContent = '扫描中...';
            document.getElementById('scanStatus').textContent = '扫描中';
            document.getElementById('scanStatus').className = 'badge bg-warning text-dark scan-status-badge';

            // 隐藏扫描完成后的操作栏
            document.getElementById('postScanActions').style.display = 'none';

            document.getElementById('scanSummary').style.display = 'none';
            document.getElementById('vulnList').style.display = 'none';

            // 调用手动扫描API
            fetch('/api/scan/manual', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    ip: ip,
                    mac: mac,
                    ports: [80, 8080, 23, 2323, 8000, 1883],
                    device_type: '{{ device.device_type }}',
                    manufacturer: '{{ device.vendor }}'
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    displayScanResults(data.result);
                    showAlert('success', `扫描完成！发现 ${data.result.vuln_count} 个漏洞，风险评分: ${data.result.risk_score}/10`);

                    // 显示扫描完成后的操作栏（包含PDF下载）
                    document.getElementById('postScanActions').style.display = 'block';
                } else {
                    showAlert('danger', '扫描失败: ' + (data.message || '未知错误'));
                }
            })
            .catch(error => {
                showAlert('danger', '网络错误: ' + error.message);
            })
            .finally(() => {
                document.getElementById('scanBtn').disabled = false;
                document.getElementById('scanSpinner').style.display = 'none';
                document.getElementById('scanBtnText').textContent = '🔍 重新扫描';
                document.getElementById('scanStatus').textContent = '扫描完成';
                document.getElementById('scanStatus').className = 'badge bg-success scan-status-badge';
            });
        }

        function displayScanResults(data) {
            document.getElementById('scanSummary').style.display = 'block';
            document.getElementById('riskScore').textContent = data.risk_score;

            const scoreEl = document.getElementById('riskScore');
            if (data.risk_score >= 7) scoreEl.className = 'risk-score text-danger';
            else if (data.risk_score >= 4) scoreEl.className = 'risk-score text-warning';
            else scoreEl.className = 'risk-score text-success';

            // 计算各类漏洞数量
            let critical = 0, high = 0, medium = 0, low = 0;
            if (data.vulnerabilities) {
                data.vulnerabilities.forEach(v => {
                    const sev = (v.severity || '').toUpperCase();
                    if (sev === 'CRITICAL') critical++;
                    else if (sev === 'HIGH') high++;
                    else if (sev === 'MEDIUM') medium++;
                    else low++;
                });
            }

            document.getElementById('criticalCount').textContent = '严重: ' + critical;
            document.getElementById('highCount').textContent = '高危: ' + high;
            document.getElementById('mediumCount').textContent = '中危: ' + medium;
            document.getElementById('lowCount').textContent = '低危: ' + low;

            document.getElementById('scanSummaryText').textContent = `发现 ${data.vuln_count} 个安全问题`;
            document.getElementById('scanTime').textContent = new Date().toLocaleString();

            if (data.vulnerabilities && data.vulnerabilities.length > 0) {
                displayVulnerabilityList(data.vulnerabilities);
            }
        }

        function displayVulnerabilityList(vulnerabilities) {
            const accordion = document.getElementById('vulnAccordion');
            accordion.innerHTML = '';

            vulnerabilities.forEach((vuln, index) => {
                const severityClass = {
                    'CRITICAL': 'vuln-critical',
                    'HIGH': 'vuln-high',
                    'MEDIUM': 'vuln-medium',
                    'LOW': 'vuln-low'
                }[vuln.severity] || 'vuln-low';

                const item = document.createElement('div');
                item.className = 'accordion-item mb-2';
                item.innerHTML = `
                    <h2 class="accordion-header" id="heading${index}">
                        <button class="accordion-button ${index === 0 ? '' : 'collapsed'}" type="button"
                                data-bs-toggle="collapse" data-bs-target="#collapse${index}">
                            <span class="badge ${severityClass} me-3 vuln-counter">${vuln.severity}</span>
                            <strong>${vuln.type || '未知漏洞'}</strong>
                        </button>
                    </h2>
                    <div id="collapse${index}" class="accordion-collapse collapse ${index === 0 ? 'show' : ''}"
                         data-bs-parent="#vulnAccordion">
                        <div class="accordion-body">
                            <p><strong>描述:</strong> ${vuln.description || '无'}</p>
                            <p><strong>证据:</strong> <code class="bg-light px-2 py-1 rounded">${vuln.proof || 'N/A'}</code></p>
                            ${vuln.username ? `<p><strong>用户名:</strong> <span class="text-danger">${vuln.username}</span></p>` : ''}
                            ${vuln.password ? `<p><strong>密码:</strong> <span class="text-danger font-monospace">${vuln.password}</span></p>` : ''}
                            <div class="fix-box bg-white rounded">
                                <strong class="text-success">🔧 修复建议:</strong><br>
                                ${vuln.fix || '请联系厂商获取安全更新'}
                            </div>
                        </div>
                    </div>
                `;
                accordion.appendChild(item);
            });

            document.getElementById('vulnList').style.display = 'block';
        }

        function loadScanHistory(ip) {
            fetch('/api/scan/status/' + encodeURIComponent(ip))
                .then(response => response.json())
                .then(data => {
                    const historyList = document.getElementById('historyList');

                    if (!data.vulnerabilities || data.vulnerabilities.length === 0) {
                        historyList.innerHTML = '<div class="text-muted p-3 bg-light rounded">暂无扫描记录</div>';
                        return;
                    }

                    historyList.innerHTML = '';
                    data.vulnerabilities.forEach(vuln => {
                        const item = document.createElement('div');
                        item.className = 'list-group-item list-group-item-action p-3';

                        const severityBadge = {
                            'CRITICAL': 'bg-dark',
                            'HIGH': 'bg-danger',
                            'MEDIUM': 'bg-warning text-dark',
                            'LOW': 'bg-secondary'
                        }[vuln.severity] || 'bg-secondary';

                        item.innerHTML = `
                            <div class="d-flex w-100 justify-content-between align-items-center mb-2">
                                <h6 class="mb-0">
                                    <span class="badge ${severityBadge} me-2">${vuln.severity}</span>
                                    ${vuln.vuln_type || vuln.type}
                                </h6>
                                <small class="text-muted">${new Date(vuln.scan_time).toLocaleString()}</small>
                            </div>
                            <p class="mb-0 text-muted small">${vuln.description || ''}</p>
                        `;
                        historyList.appendChild(item);
                    });
                })
                .catch(error => {
                    document.getElementById('historyList').innerHTML =
                        '<div class="alert alert-danger">加载失败: ' + error.message + '</div>';
                });
        }

        function showAlert(type, message) {
            const alert = document.getElementById('scanAlert');
            alert.className = `alert alert-${type} alert-dismissible fade show`;
            alert.innerHTML = message + '<button type="button" class="btn-close" data-bs-dismiss="alert"></button>';
            alert.classList.remove('d-none');

            setTimeout(() => {
                alert.classList.add('d-none');
            }, 5000);
        }

        document.addEventListener('DOMContentLoaded', function() {
            const ip = '{{ device.ip }}';
            if (ip && ip !== 'unknown') {
                loadScanHistory(ip);
            }
        });
    </script>
</body>
</html>
